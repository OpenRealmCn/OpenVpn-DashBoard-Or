name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 构建前端
        working-directory: web
        run: |
          npm install --no-fund --no-audit
          npm run build

      - name: 测试
        run: |
          go vet ./...
          go test ./...

      - name: 交叉编译
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/ovpn-web-linux-amd64 ./cmd/ovpn-web
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/ovpn-web-linux-arm64 ./cmd/ovpn-web
          cd dist && sha256sum ovpn-web-linux-amd64 ovpn-web-linux-arm64 > SHA256SUMS

      - name: 发布 Release(资产上传带重试,防上传端瞬时故障)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          for i in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" \
                 dist/ovpn-web-linux-amd64 dist/ovpn-web-linux-arm64 dist/SHA256SUMS --clobber; then
              exit 0
            fi
            echo "资产上传失败,${i}/5 次重试,15 秒后再试 …"
            sleep 15
          done
          echo "::error::资产上传连续失败"
          exit 1
