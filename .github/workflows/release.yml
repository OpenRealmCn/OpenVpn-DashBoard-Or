name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 构建前端
        working-directory: web
        run: |
          npm install --no-fund --no-audit
          npm run build

      - name: 测试
        run: |
          go vet ./...
          go test ./...

      - name: 交叉编译
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/ovpn-web-linux-amd64 ./cmd/ovpn-web
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/ovpn-web-linux-arm64 ./cmd/ovpn-web

      - name: 发布 Release(已存在则仅补传资产)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ovpn-web-linux-amd64 dist/ovpn-web-linux-arm64 \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" dist/ovpn-web-linux-amd64 dist/ovpn-web-linux-arm64 --clobber
